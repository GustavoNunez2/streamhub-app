name: Build/Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Actualizamos a una versión compatible con 2026

      - name: Install Dependencies
        run: npm install --legacy-peer-deps # Evita conflictos de versiones de paquetes

      - name: Build React App
        run: npm run build
        env:
          CI: false # Esto evita que la build falle por simples warnings

      - name: Build Electron App
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-Windows-Build
          path: dist_electron/*.exe # Corregimos la ruta típica de salida de electron-builder
